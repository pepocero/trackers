name: Actualizar trackers.txt

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar public/trackers.txt
        run: node scripts/generate-trackers.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/trackers.txt
          if git diff --staged --quiet; then
            echo "Sin cambios en trackers.txt"
            exit 0
          fi
          git commit -m "chore: actualizar trackers.txt"
          git push
